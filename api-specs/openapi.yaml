  /api/v1/groups/{groupJid}/settings:
    patch:
      summary: Update Group Operational Settings
      description: Updates group announcement mode, member editing rights, join approval mode, and disappearing message timers.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: groupJid
          required: true
