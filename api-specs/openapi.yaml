      description: Queues a text message to a WhatsApp group via the outbox. Supports mentions (or `"all"` for group-wide alerts) and quoted replies.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: groupJid
          required: true
          schema:
            type: string
          example: "123456789-987654@g.us"
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - message
              properties:
                sessionId:
                  type: string
                message:
                  type: string
                  example: "Team meeting starts in 10 minutes!"
                mentions:
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
