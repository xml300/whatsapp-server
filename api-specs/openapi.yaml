                  enum: [86400, 604800, 2592000]
                  default: 86400
                  example: 86400
                fromMe:
                  type: boolean
                  example: true
      responses:
        '202':
          description: Pin action queued in outbox for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure.
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/messages/star:
    post:
      summary: Star or Unstar Message
      description: Stars or unstars a message in chat history. Completes immediately upon socket dispatch.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - messageId
                - remoteJid
                - star
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                messageId:
                  type: string
                  example: "3EB091AE751D87A0"
                remoteJid:
                  type: string
                  example: "2348012345678@s.whatsapp.net"
                star:
                  type: boolean
                  description: True to star, false to unstar
                  example: true
                fromMe:
                  type: boolean
                  example: false
      responses:
        '202':
          description: Star action queued in outbox for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure.
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/messages/forward:
    post:
      summary: Forward Message
      description: Forwards an existing message to another chat or group without re-uploading media assets. Automatically resolves historic stanzas from event store or outbox archive.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                recipientJid:
                  type: string
                  description: Destination JID or phone number
                  example: "2348099887766@s.whatsapp.net"
                phoneNumber:
                  type: string
                  description: Destination phone number (shorthand for recipientJid)
                  example: "08099887766"
                messageId:
                  type: string
                  description: Original WhatsApp message ID to forward
                  example: "3EB091AE751D87A0"
                remoteJid:
                  type: string
                  description: Chat JID of the original message
                  example: "2348012345678@s.whatsapp.net"
                fromMe:
                  type: boolean
                  example: false
                force:
                  type: boolean
                  description: Force forward flag
                  example: false
      responses:
        '202':
          description: Forward action queued in outbox for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure.
        '401':
          description: Invalid API key.
        '404':
          description: Target message not found in history.
        '500':
          description: Internal server error.

  /api/v1/presence:
    post:
      summary: Broadcast User Presence State
      description: Broadcasts composing, recording, or online availability presence to a specific chat or globally across WhatsApp. Synchronous control plane operation.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - presence
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                presence:
                  type: string
                  enum: [composing, recording, paused, available, unavailable]
                  example: "composing"
                toJid:
                  type: string
                  description: Optional target conversation JID or phone number
                  example: "2348012345678@s.whatsapp.net"
      responses:
        '200':
          description: Presence broadcasted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Presence updated successfully"
        '400':
          description: Validation failure.
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/presence/subscribe:
    post:
      summary: Subscribe to Contact Presence
      description: Subscribes to live presence updates for a specific contact or group.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - toJid
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                toJid:
                  type: string
                  description: Target contact or group JID
                  example: "2348012345678@s.whatsapp.net"
      responses:
        '200':
          description: Subscribed to presence updates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Subscribed to presence updates"
        '400':
          description: Validation failure.
        '401':
          description: Invalid API key.

  /api/v1/chats/{jid}/modify:
    post:
      summary: Modify Chat State (Archive, Pin, Mute)
      description: Applies conversation state modifications (archive/unarchive, pin/unpin, mute/unmute) directly over the active socket.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: jid
          required: true
          schema:
            type: string
          description: Target conversation JID (user @s.whatsapp.net or group @g.us)
          example: "2348012345678@s.whatsapp.net"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - action
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                action:
                  type: string
                  enum: [archive, unarchive, pin, unpin, mute, unmute]
                  example: "mute"
                muteDurationMs:
                  type: integer
                  description: Duration in milliseconds when muting (e.g. 28800000 for 8 hours)
                  example: 28800000
      responses:
        '200':
          description: Chat modified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Chat modified successfully"
        '400':
          description: Validation failure.
        '401':
          description: Invalid API key.

  /api/v1/groups:
    get:
      summary: Fetch Participating Groups
      description: Retrieves all WhatsApp groups in which the active session is currently participating.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
          description: WhatsApp session ID
      responses:
        '200':
          description: List of participating groups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: object
        '401':
          description: Invalid API key.
    post:
      summary: Create New Group
      description: Creates a new WhatsApp group with initial participants.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - subject
                - participants
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                subject:
                  type: string
                  description: Title of group
                  example: "Engineering Guild"
                participants:
                  type: array
                  items:
                    type: string
                  description: Initial participant phone numbers or JIDs
                  example: ["08011223344", "08055667788"]
      responses:
        '200':
          description: Group created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      group:
                        type: object

  /api/v1/groups/accept-invite:
    post:
      summary: Join Group via Invite Code
      description: Joins a WhatsApp group using its invite code link snippet.
