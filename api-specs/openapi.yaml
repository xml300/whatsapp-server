  /api/v1/outbox:
    get:
      summary: Query Outbox Items
      description: Retrieve paginated outbox messages and their current delivery states with cursor-based pagination.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: sessionId
          required: false
          schema:
            type: string
          description: Filter outbox items by session ID.
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [QUEUED, PROCESSING, DISPATCHED, DELIVERED_TO_SERVER, FAILED_TERMINAL, CANCELLED]
          description: Filter outbox items by status.
        - in: query
          name: after
          required: false
          schema:
            type: string
          description: MongoDB ObjectId cursor. Returns items created strictly after this ID.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Maximum number of outbox items to return.
      responses:
        '200':
          description: Paginated outbox items retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OutboxItem'
                      nextCursor:
                        type: string
                        nullable: true
                        example: "6725225c57fa85b5420cb051"
                      hasMore:
                        type: boolean
                        example: false
        '401':
          description: Invalid API key.
        '404':
          description: Session not found (if sessionId filter provided).

  /api/v1/outbox/{outboxId}:
    get:
      summary: Get Outbox Item Details
      description: Retrieves the detailed status, delivery attempts, timestamps, and error history of a specific outbox item.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the outbox item.
      responses:
        '200':
          description: Outbox item found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OutboxItem'
        '401':
          description: Invalid API key.
        '404':
          description: Outbox item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

    delete:
      summary: Cancel Queued Outbox Item
      description: Cancels an outbox message and purges any staged media file. Only messages in `QUEUED` state can be cancelled.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the outbox item.
      responses:
        '200':
          description: Outbox item successfully cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      outboxId:
                        type: string
                        example: "6725225c57fa85b5420cb051"
                      status:
                        type: string
                        example: "cancelled"
                      message:
                        type: string
                        example: "Outbox item cancelled"
        '401':
          description: Invalid API key.
        '404':
          description: Outbox item not found.
        '409':
          description: Cannot cancel item not in QUEUED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/outbox/{outboxId}/retry:
    post:
      summary: Retry Terminal or Cancelled Outbox Item
      description: Re-queues a failed (`FAILED_TERMINAL`) or cancelled (`CANCELLED`) outbox message for immediate re-attempt. Resets attempt counter to 0.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the outbox item.
      responses:
        '202':
          description: Outbox item re-queued for delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      outboxId:
                        type: string
                        example: "6725225c57fa85b5420cb051"
                      messageId:
                        type: string
                        example: "3EB091AE751D87A0"
                      status:
                        type: string
                        example: "queued"
                      message:
                        type: string
                        example: "Outbox item re-queued for delivery"
        '401':
          description: Invalid API key.
        '404':
          description: Outbox item not found.
        '409':
          description: Conflict - only FAILED_TERMINAL or CANCELLED items can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '410':
          description: Gone - staged media file was already cleaned up. File must be re-uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'


