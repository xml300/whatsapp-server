openapi: 3.0.3
info:
  title: WhatsApp Gateway Server API
  version: 1.0.0
  description: |
    Production REST API server for multi-session WhatsApp Web automation, connection management,
    message dispatch, media transfer, and real-time Server-Sent Events (SSE) message streaming.
servers:
  - url: /
    description: Root Server URL

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key authentication header for WhatsApp connection and messaging endpoints.
    CookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: JWT cookie authentication for administrative user, session, and API key management endpoints.

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional client-generated UUID v4 idempotency key to prevent duplicate message dispatch.
      schema:
        type: string
        format: uuid
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

  schemas:
    StandardSuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response payload

    StandardErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              example: 400
            message:
              type: string
              example: "Invalid request payload or missing required parameter"

    UserResponse:
      type: object
      properties:
        username:
          type: string
          example: "john_doe"
        createdAt:
          type: string
          format: date-time
          example: "2026-08-16T12:00:00.000Z"

    ApiKeyItem:
      type: object
      properties:
        _id:
          type: string
          example: "64f8a1b2c3d4e5f6a7b8c9d0"
        userId:
          type: string
          example: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
        apiKey:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SessionItem:
      type: object
      properties:
        id:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"
        userId:
          type: string
          example: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
        phoneNumber:
          type: string
          example: "2348012345678"

    LogItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          example: "HTTP_SERVER"
        message:
          type: string
          example: "[GET] /api/v1/sessions - 200 OK"
        level:
          type: string
          enum: [INFO, DEBUG, ERROR, WARN]
          example: "INFO"
        timestamp:
          type: string
          format: date-time

    OutboxEnqueueResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            outboxId:
              type: string
              example: "6725225c57fa85b5420cb051"
            messageId:
              type: string
              example: "3EB091AE751D87A0"
            remoteJid:
              type: string
              example: "2348012345678@s.whatsapp.net"
            status:
              type: string
              enum: [queued, processing, dispatched, delivered_to_server, failed_terminal, cancelled]
              example: "queued"
            idempotencyKey:
              type: string
              example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
            deduplicated:
              type: boolean
              example: false
            message:
              type: string
              example: "Message queued for delivery"

    OutboxItem:
      type: object
      properties:
        _id:
          type: string
          example: "6725225c57fa85b5420cb051"
        userId:
          type: string
          example: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
        sessionId:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"
        idempotencyKey:
          type: string
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        waMessageId:
          type: string
          example: "3EB091AE751D87A0"
        recipientJid:
          type: string
          example: "2348012345678@s.whatsapp.net"
        actionType:
          type: string
          enum: [text, media_url, media_file, voice, react, delete, read]
          example: "text"
        payload:
          type: object
        simulateTyping:
          type: boolean
          example: false
        status:
          type: string
          enum: [QUEUED, PROCESSING, DISPATCHED, DELIVERED_TO_SERVER, FAILED_TERMINAL, CANCELLED]
          example: "QUEUED"
        attempts:
          type: integer
          example: 0
        maxAttempts:
          type: integer
          example: 6
        nextAttemptAt:
          type: string
          format: date-time
        dispatchedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /api/health:
    get:
      summary: Server Health & Active Sessions Check
      description: Returns health status and a list of currently active WhatsApp session IDs.
      responses:
        '200':
          description: Server is operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        example: true
                      activeSessions:
                        type: array
                        items:
                          type: string
                        example: ["d41d8cd98f00b204e9800998ecf8427e"]

  /api/logs:
    get:
      summary: Retrieve Paginated Application Logs
      description: Fetches persisted application logs from MongoDB with pagination metadata.
      security:
        - CookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Number of log items per page
      responses:
        '200':
          description: Paginated logs retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogItem'
                  meta:
                    type: object
                    properties:
                      totalPages:
                        type: integer
                        example: 5
                      currentPage:
                        type: integer
                        example: 1
                      logsPerPage:
                        type: integer
                        example: 100
                      totalLogs:
                        type: integer
                        example: 450
        '500':
          description: Internal server error while reading logs.

  /api/auth/register:
    post:
      summary: Register User
      description: Registers a new administrative user and sets an HTTP-only JWT `auth_token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "admin_user"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
      responses:
        '200':
          description: User registered successfully. `auth_token` cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "auth_token=eyJhbGciOiJIUzI1Ni...; Path=/; HttpOnly"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing or invalid username/password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: User already exists or database failure.

  /api/auth/login:
    post:
      summary: Login User
      description: Authenticates user credentials and issues an HTTP-only JWT `auth_token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "admin_user"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
      responses:
        '200':
          description: Authentication successful. `auth_token` cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "auth_token=eyJhbGciOiJIUzI1Ni...; Path=/; HttpOnly"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation failure.
        '401':
          description: Invalid username or password.

  /api/api-keys:
    get:
      summary: List User API Keys
      description: Returns all API keys generated for the authenticated user.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: List of API keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      apiKeys:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKeyItem'
        '401':
          description: Unauthorized - missing or invalid `auth_token` cookie.

  /api/api-keys/generate:
    post:
      summary: Generate New API Key
      description: Generates and persists a new UUID v4 API key for the authenticated user.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: API key generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      apiKey:
                        type: string
                        format: uuid
                        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        '401':
          description: Unauthorized.

  /api/sessions:
    get:
      summary: List User WhatsApp Sessions
      description: Returns all configured WhatsApp session records for the authenticated user.
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Sessions list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionItem'
        '401':
          description: Unauthorized.
    post:
      summary: Create WhatsApp Session
      description: Registers a new WhatsApp phone number and creates a corresponding session ID.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
              properties:
                phoneNumber:
                  type: string
                  description: Phone number in international or local format (e.g., 08012345678 or 2348012345678)
                  example: "08012345678"
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      session:
                        $ref: '#/components/schemas/SessionItem'
        '400':
          description: Invalid phone number or validation failure.
        '401':
          description: Unauthorized.

  /api/v1/connection:
    post:
      summary: Connect WhatsApp Session
      description: Initiates the Baileys socket connection for a specific session ID and phone number.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  example: "08012345678"
      responses:
        '200':
          description: Connection initiated or already active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      serviceStatus:
                        type: string
                        example: "connected"
                      sessionId:
                        type: string
                        example: "d41d8cd98f00b204e9800998ecf8427e"
        '400':
          description: Connection failed or phone number is already connected.
        '401':
          description: Phone number not registered or invalid API key.
        '404':
          description: Session not found.

  /api/v1/connection/{sessionId}/status:
    get:
      summary: Get Connection & Pairing Status
      description: Returns the real-time status of the WhatsApp socket and whether pairing/QR is ready.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Unique session ID
      responses:
        '200':
          description: Current socket state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      isConnected:
                        type: boolean
                        example: true
                      isPairingReady:
                        type: boolean
                        example: false
                      status:
                        type: string
                        enum: [connected, connecting, reconnecting, degraded, disconnected]
                        example: "connected"
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.

  /api/v1/connection/{sessionId}/qr:
    get:
      summary: Get WhatsApp QR Code
      description: Retrieves the active QR code string for scanning in WhatsApp Mobile App.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Unique session ID
      responses:
        '200':
          description: QR code string payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      qr:
                        type: string
                        nullable: true
                        example: "2@xP5k...==,3k9J...==,1@f7..."
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.

  /api/v1/connection/{sessionId}/pairing-code:
    get:
      summary: Get WhatsApp 8-Digit Pairing Code
      description: Retrieves the 8-character pairing code for linking via phone number without QR code.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Unique session ID
      responses:
        '200':
          description: Pairing code payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      pairingCode:
                        type: string
                        nullable: true
                        example: "ABCD-1234"
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.

  /api/v1/connection/{sessionId}/end:
    post:
      summary: Terminate WhatsApp Session
      description: Gracefully closes the Baileys socket and terminates the session.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Unique session ID
      responses:
        '200':
          description: Session terminated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      serviceStatus:
                        type: string
                        enum: ["disconnected", "failed to disconnect"]
                        example: "disconnected"
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.

  /api/v1/events:
    get:
      summary: Poll WhatsApp Events
      description: Retrieve persisted WhatsApp events (incoming messages, message receipts, connection state changes) with cursor-based pagination.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
          description: Filter events by session ID.
        - name: eventType
          in: query
          required: false
          schema:
            type: string
          description: Filter by event type (e.g. message, message.update, connection, qr).
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: MongoDB ObjectId cursor. Returns events created strictly after this ID.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of events to return.
      responses:
        '200':
          description: List of events matching criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "6724fa0e219ba3cb9e9ef402"
                            userId:
                              type: string
                            sessionId:
                              type: string
                            eventType:
                              type: string
                              example: "message"
                            payload:
                              type: object
                            createdAt:
                              type: string
                              format: date-time
                      count:
                        type: integer
                        example: 1
                      lastCursor:
                        type: string
                        nullable: true
                        example: "6724fa0e219ba3cb9e9ef402"
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.
    delete:
      summary: Delete Events for Session
      description: Purge persisted events for a specific session.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
          description: Session ID whose events to clear.
      responses:
        '200':
          description: Events successfully deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        example: 5
        '400':
          description: Missing sessionId query parameter.
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.

  /api/v1/send/typing:
    post:
      summary: Send Typing Presence Indicator
      description: Broadcasts a typing/composing presence indicator to a recipient WhatsApp chat.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
      responses:
        '200':
          description: Typing indicator sent successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Typing sent successfully"
        '400':
          description: Failed to send typing indicator or invalid payload.
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/send/text:
    post:
      summary: Send Text Message
      description: Queues a plain text message in the outbox for resilient asynchronous delivery to a WhatsApp recipient.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
                - message
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
                message:
                  type: string
                  example: "Hello from WhatsApp Server!"
                simulateTyping:
                  type: boolean
                  description: Whether to simulate human typing indicator before dispatch
                  example: false
      responses:
        '202':
          description: Message queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure or send failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/send/file:
    post:
      summary: Send Media File / Document
      description: Stages and queues an image, video, audio, or document (up to 25MB) in the outbox using `multipart/form-data`. Staged files are unlinked after delivery or terminal failure.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
                - file
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
                caption:
                  type: string
                  description: Optional caption for media (images, videos, documents)
                  example: "Monthly report attachment"
                file:
                  type: string
                  format: binary
                  description: Media or document binary file (max 25MB)
                simulateTyping:
                  type: boolean
                  description: Whether to simulate human typing indicator before dispatch
                  example: false
      responses:
        '202':
          description: Media file staged and queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Invalid file format, exceeding 25MB, or send failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/send/media:
    post:
      summary: Send Media via URL
      description: Queues a media file from a remote public URL for asynchronous dispatch. Validates URL against private network SSRF attacks.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
                - mediaType
                - mediaUrl
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
                mediaType:
                  type: string
                  description: Type of media to send
                  enum: [image, video, audio, document]
                  example: "image"
                mediaUrl:
                  type: string
                  format: uri
                  description: Public URL of the media file
                  example: "https://example.com/images/sample.jpg"
                caption:
                  type: string
                  description: Optional caption for the media
                  example: "Check out this image"
                simulateTyping:
                  type: boolean
                  description: Whether to simulate human typing indicator before dispatch
                  example: false
      responses:
        '202':
          description: Media queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure or blocked private URL (SSRF).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/send/voice:
    post:
      summary: Send Voice Note / PTT
      description: Uploads and queues an audio recording as a push-to-talk (PTT) voice note in the outbox. Staged audio is unlinked after delivery or terminal failure.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
                - file
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
                file:
                  type: string
                  format: binary
                  description: Audio binary file (audio/ogg, audio/mp4, audio/mpeg, etc.)
                simulateTyping:
                  type: boolean
                  description: Whether to simulate human typing indicator before dispatch
                  example: false
      responses:
        '202':
          description: Voice note queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Unsupported media type (not audio) or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/contacts/{phoneNumber}/on-whatsapp:
    get:
      summary: Check if Phone Number is on WhatsApp
      description: Verifies whether the specified phone number is registered on WhatsApp.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: phoneNumber
          required: true
          schema:
            type: string
          description: Target phone number
          example: "08012345678"
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
          description: Session ID to check against
          example: "d41d8cd98f00b204e9800998ecf8427e"
      responses:
        '200':
          description: Contact status check completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      phoneNumber:
                        type: string
                        example: "08012345678"
                      exists:
                        type: boolean
                        example: true
        '401':
          description: Invalid API key.
        '404':
          description: Session not found.

  /api/v1/messages/react:
    post:
      summary: React to a Message
      description: Queues an emoji reaction to an existing message in the outbox.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - messageId
                - remoteJid
                - emoji
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                messageId:
                  type: string
                  description: Unique WhatsApp message ID to react to
                  example: "3EB091AE751D87A0"
                remoteJid:
                  type: string
                  description: JID of the chat or recipient
                  example: "2348012345678@s.whatsapp.net"
                emoji:
                  type: string
                  description: Emoji character to react with, or empty string to remove reaction
                  example: "👍"
                fromMe:
                  type: boolean
                  description: Whether the target message was sent by the current session
                  example: false
      responses:
        '202':
          description: Reaction queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/messages/delete:
    post:
      summary: Delete a Message (Revoke)
      description: Queues a message deletion (revoke for everyone) in the outbox.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - messageId
                - remoteJid
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                messageId:
                  type: string
                  description: Unique WhatsApp message ID to delete
                  example: "3EB091AE751D87A0"
                remoteJid:
                  type: string
                  description: JID of the chat or recipient
                  example: "2348012345678@s.whatsapp.net"
                fromMe:
                  type: boolean
                  description: Whether the target message was sent by the current session (default true)
                  example: true
      responses:
        '202':
          description: Message deletion queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/messages/read:
    post:
      summary: Mark Message as Read
      description: Queues a read receipt for incoming messages in the outbox.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - messageId
                - remoteJid
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                messageId:
                  type: string
                  description: Unique WhatsApp message ID to mark as read
                  example: "3EB091AE751D87A0"
                remoteJid:
                  type: string
                  description: JID of the chat or sender
                  example: "2348012345678@s.whatsapp.net"
                fromMe:
                  type: boolean
                  description: Whether the target message was sent by the current session (default false)
                  example: false
      responses:
        '202':
          description: Read receipt queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/outbox:
    get:
      summary: Query Outbox Items
      description: Retrieve paginated outbox messages and their current delivery states with cursor-based pagination.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: sessionId
          required: false
          schema:
            type: string
          description: Filter outbox items by session ID.
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [QUEUED, PROCESSING, DISPATCHED, DELIVERED_TO_SERVER, FAILED_TERMINAL, CANCELLED]
          description: Filter outbox items by status.
        - in: query
          name: after
          required: false
          schema:
            type: string
          description: MongoDB ObjectId cursor. Returns items created strictly after this ID.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Maximum number of outbox items to return.
      responses:
        '200':
          description: Paginated outbox items retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OutboxItem'
                      nextCursor:
                        type: string
                        nullable: true
                        example: "6725225c57fa85b5420cb051"
                      hasMore:
                        type: boolean
                        example: false
        '401':
          description: Invalid API key.
        '404':
          description: Session not found (if sessionId filter provided).

  /api/v1/outbox/{outboxId}:
    get:
      summary: Get Outbox Item Details
      description: Retrieves the detailed status, delivery attempts, timestamps, and error history of a specific outbox item.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the outbox item.
      responses:
        '200':
          description: Outbox item found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/OutboxItem'
        '401':
          description: Invalid API key.
        '404':
          description: Outbox item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

    delete:
      summary: Cancel Queued Outbox Item
      description: Cancels an outbox message and purges any staged media file. Only messages in `QUEUED` state can be cancelled.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the outbox item.
      responses:
        '200':
          description: Outbox item successfully cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      outboxId:
                        type: string
                        example: "6725225c57fa85b5420cb051"
                      status:
                        type: string
                        example: "cancelled"
                      message:
                        type: string
                        example: "Outbox item cancelled"
        '401':
          description: Invalid API key.
        '404':
          description: Outbox item not found.
        '409':
          description: Cannot cancel item not in QUEUED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/outbox/{outboxId}/retry:
    post:
      summary: Retry Terminal or Cancelled Outbox Item
      description: Re-queues a failed (`FAILED_TERMINAL`) or cancelled (`CANCELLED`) outbox message for immediate re-attempt. Resets attempt counter to 0.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: outboxId
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the outbox item.
      responses:
        '202':
          description: Outbox item re-queued for delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      outboxId:
                        type: string
                        example: "6725225c57fa85b5420cb051"
                      messageId:
                        type: string
                        example: "3EB091AE751D87A0"
                      status:
                        type: string
                        example: "queued"
                      message:
                        type: string
                        example: "Outbox item re-queued for delivery"
        '401':
          description: Invalid API key.
        '404':
          description: Outbox item not found.
        '409':
          description: Conflict - only FAILED_TERMINAL or CANCELLED items can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '410':
          description: Gone - staged media file was already cleaned up. File must be re-uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
