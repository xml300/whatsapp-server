                  example: "C7Xz8yA1b2c"
      responses:
        '200':
          description: Joined group successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      groupJid:
                        type: string
                        example: "123456789-987654@g.us"

  /api/v1/groups/invite-info/{code}:
