  /api/v1/send/file:
    post:
      summary: Send Media File / Document
      description: Stages and queues an image, video, audio, or document (up to 25MB) in the outbox using `multipart/form-data`. Staged files are unlinked after delivery or terminal failure.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
                - file
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
                caption:
                  type: string
                  description: Optional caption for media (images, videos, documents)
                  example: "Monthly report attachment"
                file:
                  type: string
                  format: binary
                  description: Media or document binary file (max 25MB)
                simulateTyping:
                  type: boolean
                  description: Whether to simulate human typing indicator before dispatch
                  example: false
                viewOnce:
                  type: boolean
                  description: When true, sends media as a view-once asset
                  example: false
                mentions:
                  type: string
                  description: JSON array string of phone numbers or JIDs to mention
                quotedMessageId:
                  type: string
                  description: Shorthand message ID to quote
      responses:
        '202':
          description: Media file staged and queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Invalid file format, exceeding 25MB, or send failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

  /api/v1/send/media:
    post:
      summary: Send Media via URL
      description: Queues a media file from a remote public URL for asynchronous dispatch. Validates URL against private network SSRF attacks.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - phoneNumber
                - mediaType
                - mediaUrl
              properties:
                sessionId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                phoneNumber:
                  type: string
                  description: Target recipient phone number
                  example: "08012345678"
                mediaType:
                  type: string
                  description: Type of media to send
                  enum: [image, video, audio, document]
                  example: "image"
                mediaUrl:
                  type: string
                  format: uri
                  description: Public URL of the media file
                  example: "https://example.com/images/sample.jpg"
                caption:
                  type: string
                  description: Optional caption for the media
                  example: "Check out this image"
                simulateTyping:
                  type: boolean
                  description: Whether to simulate human typing indicator before dispatch
                  example: false
                viewOnce:
                  type: boolean
                  description: When true, sends media as a view-once asset
                  example: false
                mentions:
                  type: array
                  items:
                    type: string
                  description: Array of phone numbers or JIDs to mention
                quoted:
                  $ref: '#/components/schemas/QuotedMessageInput'
                quotedMessageId:
                  type: string
                  description: Shorthand message ID to quote
      responses:
        '202':
          description: Media queued in outbox for resilient delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEnqueueResponse'
        '400':
          description: Validation failure or blocked private URL (SSRF).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Invalid API key.
        '500':
          description: Internal server error.

